# Activate together with prod. Keep local MySQL/Gmail profiles unchanged.
server.address=0.0.0.0
server.port=${PORT:10000}
server.forward-headers-strategy=framework
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME:defaultdb}?sslMode=VERIFY_IDENTITY&trustCertificateKeyStoreUrl=${DB_TRUSTSTORE_URL}&trustCertificateKeyStoreType=PKCS12&trustCertificateKeyStorePassword=changeit&fallbackToSystemTrustStore=false&allowPublicKeyRetrieval=false
spring.datasource.hikari.maximum-pool-size=4
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.data-source-properties.connectTimeout=10000
spring.datasource.hikari.data-source-properties.socketTimeout=30000
server.tomcat.threads.max=25
server.tomcat.threads.min-spare=2
account.mail.mode=brevo
account.mail.brevo.api-key=${BREVO_API_KEY}
account.mail.from=${ACCOUNT_MAIL_FROM}
account.public-base-url=${ACCOUNT_PUBLIC_BASE_URL}
account.mail.queue.poll-delay-ms=5000
security.accounts.require-verified-email=true
security.abuse.enabled=true
# Enable only after hosted delivery and recovery have been validated.
security.public-access.enabled=${PUBLIC_ACCESS_ENABLED:false}
account.mail.delivery-validated=${MAIL_DELIVERY_VALIDATED:false}
