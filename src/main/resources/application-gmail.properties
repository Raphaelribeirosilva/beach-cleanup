# Add profile gmail to an existing mysql/prod environment with an HTTPS base URL.
# Values belong in the environment, never in Git. Use a Google app password.
account.mail.mode=smtp
account.mail.from=${GMAIL_USERNAME}
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.protocol=smtp
spring.mail.username=${GMAIL_USERNAME}
spring.mail.password=${GMAIL_APP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.checkserveridentity=true
spring.mail.properties.mail.debug=false
# Detect configuration/authentication failures before accepting new signups.
spring.mail.test-connection=true
security.accounts.require-verified-email=true
security.abuse.enabled=true
