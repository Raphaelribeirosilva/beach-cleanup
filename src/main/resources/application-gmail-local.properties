# Start with mysql,gmail-local; the profile group also loads gmail.
# The HTTP exception is restricted by AccountPolicy to loopback and non-prod.
server.address=127.0.0.1
account.mail.allow-local-http=true
account.public-base-url=${ACCOUNT_PUBLIC_BASE_URL:http://localhost:${server.port:8080}}
security.public-access.enabled=false
