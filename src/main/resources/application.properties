spring.application.name=beachcleanup

spring.profiles.default=test
spring.profiles.group.prod=mysql
spring.profiles.group.gmail-local=gmail
spring.jpa.open-in-view=true
spring.flyway.enabled=false
security.jwt.secret=${JWT_SECRET:}

# Bounded security-state cleanup; retention starts after absolute expiry, not revocation/consumption.
security.maintenance.enabled=true
security.maintenance.fixed-delay-ms=3600000
security.maintenance.initial-delay-ms=60000
security.maintenance.session-retention-days=7
security.maintenance.action-token-retention-days=7
security.maintenance.rate-limit-retention-hours=24
security.maintenance.batch-size=200
security.maintenance.max-batches=10

# SMTP is activated only when account.mail.mode=smtp and a host is configured.
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.checkserveridentity=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

management.endpoints.web.exposure.include=health
management.endpoints.jmx.exposure.exclude=*
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState,db

# Explicit opt-in; leave unset locally. The persisted batch marker prevents reruns.
demo.data.enabled=${DEMO_DATA_ENABLED:false}
