name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci-only-password
          MYSQL_ROOT_HOST: '%'
        ports:
          - 3306/tcp
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Verificar OpenAPI e conferência decimal
        run: |
          python tools/validate_openapi.py
          python -m unittest discover -s tools -p 'test_*.py'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Testar cliente do portal
        run: node --test tools/portal-api.test.cjs
      - name: Testar H2 e MySQL e empacotar
        env:
          MYSQL_TEST_SERVER_URL: jdbc:mysql://127.0.0.1:${{ job.services.mysql.ports['3306'] }}/?allowPublicKeyRetrieval=true&useSSL=false
          MYSQL_TEST_USER: root
          MYSQL_TEST_PASSWORD: ci-only-password
        run: sh mvnw -B -Pmysql-it verify
      - name: Verificar fluxos completos e acessibilidade no Chrome
        env:
          PORTAL_BROWSER: /usr/bin/google-chrome
        run: node tools/verify_portal_browser.cjs
      - name: Guardar relatórios de testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            target/surefire-reports/
            target/portal-performance-*.json
            target/staging-recovery-proof.json
            target/*-mobile.png
            target/*-desktop.png
            target/portal-browser-*.json
            target/portal-browser-failure.log
          if-no-files-found: warn
          retention-days: 7
